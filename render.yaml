services:
  - type: web
    name: indoor-nav-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
    disk:
      name: indoor-nav-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
